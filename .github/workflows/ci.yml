name: CI
on:
  push:
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-web.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-web.txt pytest ruff
      - name: Lint
        run: ruff check visionguard web api tests scripts
      - name: Test
        run: pytest -q

  docker-build:
    needs: lint-and-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build web image
        run: docker build -f Dockerfile.web -t 23l-0616_a2_ops-web:ci .      - name: Build API image
        run: docker build -f Dockerfile.api -t 23l-0616_a2_ops-api:ci .

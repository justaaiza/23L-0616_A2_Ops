name: 23l-0616_a2_ops-api

services:
  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    image: 23l-0616_a2_ops-api:latest
    environment:
      MODEL_PATH: /models/champion.keras
      MODEL_NAME: ${MODEL_NAME}
      MODEL_VERSION: ${MODEL_VERSION}
      THRESHOLD: ${THRESHOLD}
      API_KEY: ${API_KEY}
      MAX_UPLOAD_MB: ${MAX_UPLOAD_MB:-5}
    volumes:
      - ./models:/models:ro
    ports:
      - "80:8000"
    restart: unless-stopped